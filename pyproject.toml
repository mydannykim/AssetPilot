[project]
name = "assetpilot"
version = "0.1.0"
description = "Toss Securities + Claude 연동 실시간 자산관리 & 뉴스 트렌드 탐지"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "apscheduler>=3.10",
    "anthropic>=0.34",
    "mcp>=1.0",
    "click>=8.1",
    "feedparser>=6.0",
]

[project.scripts]
assetpilot = "assetpilot.cli:main"
assetpilot-mcp = "assetpilot.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
